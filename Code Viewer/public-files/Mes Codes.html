<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Codes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg-0:#050308;
    --bg-1:#0e0a1a;
    --violet:#a78bfa;
    --cyan:#7dfcff;
    --magenta:#ff6bcb;
    --danger:#ff5d7a;
    --text:#e8e3f5;
    --muted:#8f86ab;
    --glass:rgba(255,255,255,0.035);
    --glass-brd:rgba(167,139,250,0.18);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% -10%, #1a0f2e 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #0d1f2e 0%, transparent 40%),
      var(--bg-0);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* grille animée en fond */
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(167,139,250,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,0.06) 1px, transparent 1px);
    background-size:38px 38px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
    animation:drift 26s linear infinite;
  }
  @keyframes drift{ from{background-position:0 0;} to{background-position:38px 76px;} }

  .wrap{ position:relative; z-index:1; max-width:480px; margin:0 auto; padding:28px 18px 120px; }

  header{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .lock-icon{
    width:38px; height:38px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(167,139,250,0.18), rgba(125,252,255,0.10));
    border:1px solid var(--glass-brd);
  }
  h1{ margin:0; font-size:22px; font-weight:700; letter-spacing:.3px;
    background:linear-gradient(90deg,#c9b8ff,var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ margin:2px 0 0 50px; font-size:12.5px; color:var(--muted); letter-spacing:.2px; }

  /* menu trois points */
  .menu-wrap{ position:relative; margin-left:auto; }
  .menu-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--glass-brd);
    background:rgba(255,255,255,0.03); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .menu-btn svg{ width:19px; height:19px; }
  .menu-btn:active{ transform:scale(.93); }

  .menu-dropdown{
    position:absolute; top:46px; right:0; z-index:15; min-width:200px;
    background:linear-gradient(180deg,#170f2a,#0b0716);
    border:1px solid var(--glass-brd); border-radius:14px; padding:6px;
    box-shadow:0 14px 34px rgba(0,0,0,0.5);
    opacity:0; transform:translateY(-6px) scale(.97); pointer-events:none;
    transition:all .16s ease;
  }
  .menu-dropdown.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .menu-item{
    display:flex; align-items:center; gap:10px; width:100%; border:none; background:none;
    color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:13.5px;
    padding:11px 12px; border-radius:9px; cursor:pointer; text-align:left;
  }
  .menu-item:active{ background:rgba(255,255,255,0.06); }
  .menu-item svg{ width:16px; height:16px; color:var(--cyan); flex:0 0 auto; }

  /* modal de confirmation */
  .confirm-overlay{
    position:fixed; inset:0; z-index:30; background:rgba(4,2,10,0.82);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .confirm-overlay.show{ opacity:1; pointer-events:auto; }
  .confirm-box{
    width:100%; max-width:320px; background:linear-gradient(180deg,#170f2a,#0b0716);
    border:1px solid rgba(255,93,122,0.3); border-radius:18px; padding:22px 20px;
    transform:scale(.94); transition:transform .18s ease;
  }
  .confirm-overlay.show .confirm-box{ transform:scale(1); }
  .confirm-box h3{ margin:0 0 8px; font-size:15.5px; }
  .confirm-box p{ margin:0 0 18px; font-size:13px; color:var(--muted); line-height:1.5; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions .btn-danger{ background:linear-gradient(135deg,#ff5d7a,#ff8b6b); color:#1a0510; }

  .badge-row{ margin:18px 0 20px; }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.5px;
    color:var(--cyan); border:1px solid rgba(125,252,255,0.3);
    border-radius:20px; padding:5px 12px; background:rgba(125,252,255,0.05);
  }
  .badge svg{ width:11px; height:11px; }

  /* liste */
  .list{ display:flex; flex-direction:column; gap:12px; }

  .card{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-brd);
    border-radius:16px;
    padding:16px 14px;
    animation:rise .35s ease both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-name{ font-size:15.5px; font-weight:600; line-height:1.35; word-break:break-word; }

  .actions{ display:flex; gap:6px; flex:0 0 auto; }
  .icon-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--glass-brd);
    background:rgba(255,255,255,0.02);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer; transition:all .15s ease;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn.eye:hover, .icon-btn.eye.active{ color:var(--cyan); border-color:rgba(125,252,255,0.35); }
  .icon-btn.copy:hover, .icon-btn.copy.copied{ color:var(--violet); border-color:rgba(167,139,250,0.4); }
  .icon-btn.copy.copied{ color:#4ade80; border-color:rgba(74,222,128,0.4); }
  .icon-btn.del:hover{ color:var(--danger); border-color:rgba(255,93,122,0.4); }

  .pw-row{
    margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:14px;
    letter-spacing:2px; color:var(--text); word-break:break-all;
  }
  .pw-row.masked{ color:var(--muted); letter-spacing:3px; }

  /* état vide */
  .empty{
    text-align:center; padding:60px 20px 20px; color:var(--muted);
  }
  .empty svg{ width:46px; height:46px; margin-bottom:14px; opacity:.6; }
  .empty p{ margin:0; font-size:13.5px; line-height:1.6; }

  /* bouton flottant + */
  .fab{
    position:fixed; right:22px; bottom:28px; z-index:5;
    width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 24px rgba(167,139,250,0.35);
  }
  .fab::after{
    content:''; position:absolute; inset:-8px; border-radius:50%;
    border:2px solid rgba(125,252,255,0.55);
    animation:ring 2.6s ease-out infinite;
  }
  .fab svg{ width:26px; height:26px; color:#0a0612; position:relative; z-index:1; }
  .fab:active{ transform:scale(.94); }
  @keyframes ring{
    0%{ transform:scale(1); opacity:.7; }
    100%{ transform:scale(1.35); opacity:0; }
  }

  /* feuille d'ajout */
  .overlay{
    position:fixed; inset:0; z-index:10; background:rgba(4,2,10,0.86);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    background:linear-gradient(180deg,#150e26,#0a0714);
    border:1px solid var(--glass-brd); border-bottom:none;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-width:480px; margin:0 auto;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--glass-brd); margin:0 auto 16px; }
  .sheet h2{ margin:0 0 18px; font-size:17px; font-weight:700; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; letter-spacing:.5px; color:var(--muted); margin-bottom:7px; }
  .input-row{ position:relative; }
  input[type="text"], input[type="password"]{
    width:100%; padding:13px 14px; border-radius:12px;
    background:rgba(255,255,255,0.04); border:1px solid var(--glass-brd);
    color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:14.5px;
    outline:none; transition:border-color .15s ease;
  }
  input:focus{ border-color:var(--cyan); }
  input[type="password"]{ font-family:'JetBrains Mono',monospace; letter-spacing:2px; padding-right:44px; }
  .toggle-pw{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border:none; background:none; color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .toggle-pw svg{ width:17px; height:17px; }

  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600;
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-cancel{ background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid var(--glass-brd); }
  .btn-save{ background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#0a0612; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translate(-50%,12px);
    z-index:20; background:#111022; border:1px solid rgba(74,222,128,0.4);
    color:#b6f5c6; font-size:12.5px; padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:all .22s ease;
    display:flex; align-items:center; gap:7px;
  }
  .toast svg{ width:13px; height:13px; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  footer{ text-align:center; margin-top:34px; font-size:10.5px; letter-spacing:1.2px; color:#4d4667; }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="wrap">
  <header>
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" width="19" height="19">
        <path d="M6 10V8a6 6 0 0112 0v2" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <rect x="4" y="10" width="16" height="11" rx="3" stroke="url(#g1)" stroke-width="2"/>
        <circle cx="12" cy="15.5" r="1.6" fill="url(#g1)"/>
        <defs>
          <linearGradient id="g1" x1="4" y1="8" x2="20" y2="21">
            <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7dfcff"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1>Mes Codes</h1>
    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
      </button>
      <div class="menu-dropdown" id="menuDropdown">
        <button class="menu-item" id="btnShare">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="2.6" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="19" r="2.6" stroke="currentColor" stroke-width="1.7"/><path d="M8.3 10.7l7.4-4.4M8.3 13.3l7.4 4.4" stroke="currentColor" stroke-width="1.7"/></svg>
          Partager
        </button>
        <button class="menu-item" id="btnDownload">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Télécharger .txt
        </button>
      </div>
    </div>
  </header>
  <div id="list" class="list" style="margin-top:20px;"></div>

  <div id="empty" class="empty" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 0112 0v2" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="10" width="16" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/></svg>
    <p>Ton coffre est vide.<br>Ajoute ton premier code avec le bouton +.</p>
  </div>

  <footer>créé par NPS.NELSON</footer>
</div>

<button class="fab" id="fabAdd" aria-label="Ajouter un code">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2>Nouveau code</h2>
  <div class="field">
    <label for="nameInput">NOM DU CODE</label>
    <div class="input-row">
      <input type="text" id="nameInput" placeholder="ex : Facebook, Compte bancaire" maxlength="60">
    </div>
  </div>
  <div class="field">
    <label for="pwInput">MOT DE PASSE</label>
    <div class="input-row">
      <input type="password" id="pwInput" placeholder="Entrez le code...">
      <button class="toggle-pw" id="toggleNewPw" type="button" aria-label="Afficher">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-cancel" id="cancelBtn">Annuler</button>
    <button class="btn btn-save" id="saveBtn">Ajouter le code</button>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastText">Copié</span>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Supprimer ce code ?</h3>
    <p id="confirmText">Cette action est définitive, le code sera supprimé du coffre.</p>
    <div class="confirm-actions">
      <button class="btn btn-cancel" id="confirmCancel">Annuler</button>
      <button class="btn btn-danger" id="confirmDel">Supprimer</button>
    </div>
  </div>
</div>

<script>
(function(){
  var STORE_KEY = 'mesCodesVault';
  var vault = [];
  var shown = {}; // id -> bool, visibilité en mémoire (non persistée)

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var overlay = document.getElementById('overlay');
  var sheet = document.getElementById('sheet');
  var nameInput = document.getElementById('nameInput');
  var pwInput = document.getElementById('pwInput');
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      vault = raw ? JSON.parse(raw) : [];
    }catch(e){ vault = []; }
  }
  function persist(){
    localStorage.setItem(STORE_KEY, JSON.stringify(vault));
  }
  function uid(){
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function svgEye(open){
    return open
      ? '<svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.24 4.24M9.5 5.2A10.6 10.6 0 0112 5c6.5 0 10 7 10 7a15.6 15.6 0 01-3.1 4.1M6.6 6.6C4 8.3 2 12 2 12s2.2 4.4 6 6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  }
  var svgCopy = '<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 012-2h10" stroke="currentColor" stroke-width="1.8"/></svg>';
  var svgCheck = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var svgTrash = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-7 0v12a2 2 0 002 2h4a2 2 0 002-2V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function render(){
    listEl.innerHTML = '';
    if(!vault.length){
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    vault.slice().reverse().forEach(function(entry){
      var isShown = !!shown[entry.id];
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-name">' + esc(entry.name) + '</div>' +
          '<div class="actions">' +
            '<button class="icon-btn eye'+(isShown?' active':'')+'" data-act="eye" data-id="'+entry.id+'" aria-label="Afficher">' + svgEye(isShown) + '</button>' +
            '<button class="icon-btn copy" data-act="copy" data-id="'+entry.id+'" aria-label="Copier">' + svgCopy + '</button>' +
            '<button class="icon-btn del" data-act="del" data-id="'+entry.id+'" aria-label="Supprimer">' + svgTrash + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="pw-row'+(isShown?'':' masked')+'">' + (isShown ? esc(entry.pw) : '•'.repeat(Math.min(entry.pw.length,22))) + '</div>';
      listEl.appendChild(card);
    });
  }

  listEl.addEventListener('click', function(e){
    var btn = e.target.closest('.icon-btn');
    if(!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    var entry = vault.find(function(v){ return v.id === id; });
    if(!entry) return;

    if(act === 'eye'){
      shown[id] = !shown[id];
      render();
    } else if(act === 'copy'){
      copyToClipboard(entry.pw);
      btn.classList.add('copied');
      btn.innerHTML = svgCheck;
      showToast('Copié');
      setTimeout(function(){
        btn.classList.remove('copied');
        btn.innerHTML = svgCopy;
      }, 1400);
    } else if(act === 'del'){
      pendingDeleteId = id;
      confirmText.textContent = 'Le code "' + entry.name + '" sera supprimé définitivement du coffre.';
      confirmOverlay.classList.add('show');
    }
  });

  var pendingDeleteId = null;
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmText = document.getElementById('confirmText');
  document.getElementById('confirmCancel').addEventListener('click', function(){
    pendingDeleteId = null;
    confirmOverlay.classList.remove('show');
  });
  confirmOverlay.addEventListener('click', function(e){
    if(e.target === confirmOverlay){ pendingDeleteId = null; confirmOverlay.classList.remove('show'); }
  });
  document.getElementById('confirmDel').addEventListener('click', function(){
    if(!pendingDeleteId) return;
    vault = vault.filter(function(v){ return v.id !== pendingDeleteId; });
    delete shown[pendingDeleteId];
    persist();
    render();
    pendingDeleteId = null;
    confirmOverlay.classList.remove('show');
    showToast('Supprimé');
  });

  // --- Menu trois points : partager / télécharger ---
  var menuBtn = document.getElementById('menuBtn');
  var menuDropdown = document.getElementById('menuDropdown');
  menuBtn.addEventListener('click', function(e){
    e.stopPropagation();
    menuDropdown.classList.toggle('show');
  });
  document.addEventListener('click', function(e){
    if(!menuDropdown.contains(e.target) && e.target !== menuBtn){
      menuDropdown.classList.remove('show');
    }
  });

  function buildExportText(){
    var lines = ['Mes Codes', ''];
    vault.slice().reverse().forEach(function(entry){
      lines.push(entry.name);
      lines.push(entry.pw);
      lines.push('');
    });
    return lines.join('\n');
  }

  function utf8ToBase64(str){
    return btoa(unescape(encodeURIComponent(str)));
  }

  document.getElementById('btnDownload').addEventListener('click', function(){
    menuDropdown.classList.remove('show');
    if(!vault.length){ showToast('Coffre vide'); return; }
    var text = buildExportText();
    if(window.AppBridge && AppBridge.downloadFile){
      AppBridge.downloadFile(utf8ToBase64(text), 'Mes Codes.txt', 'text/plain');
    } else {
      var blob = new Blob([text], {type:'text/plain'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Mes Codes.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }
    showToast('Téléchargement lancé');
  });

  document.getElementById('btnShare').addEventListener('click', function(){
    menuDropdown.classList.remove('show');
    if(!vault.length){ showToast('Coffre vide'); return; }
    var text = buildExportText();
    if(window.AppBridge && AppBridge.shareText){
      AppBridge.shareText(text, 'Mes Codes.txt');
    } else if(navigator.share){
      navigator.share({ title:'Mes Codes.txt', text:text }).catch(function(){});
    } else {
      showToast('Partage indisponible, utilise Télécharger');
    }
  });

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  var toastTimer;
  function showToast(msg){
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }

  function openSheet(){
    nameInput.value = ''; pwInput.value = ''; pwInput.type = 'password';
    overlay.classList.add('show');
    sheet.classList.add('show');
    setTimeout(function(){ nameInput.focus(); }, 250);
  }
  function closeSheet(){
    overlay.classList.remove('show');
    sheet.classList.remove('show');
  }

  document.getElementById('fabAdd').addEventListener('click', openSheet);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  overlay.addEventListener('click', closeSheet);

  document.getElementById('toggleNewPw').addEventListener('click', function(){
    var isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    this.innerHTML = svgEye(isPw);
  });

  document.getElementById('saveBtn').addEventListener('click', function(){
    var name = nameInput.value.trim();
    var pw = pwInput.value;
    if(!name || !pw){
      var missing = !name ? nameInput : pwInput;
      missing.style.borderColor = '#ff5d7a';
      missing.focus();
      setTimeout(function(){ missing.style.borderColor = ''; }, 900);
      return;
    }
    vault.push({ id: uid(), name: name, pw: pw, createdAt: Date.now() });
    persist();
    render();
    closeSheet();
    showToast('Code ajouté');
  });

  load();
  render();
})();
</script>
</body>
</html>
